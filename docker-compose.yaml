services:
  nginx-static:
    image: 989570211471.dkr.ecr.us-east-2.amazonaws.com/docker-images/nginx-static:commit-371c46e0
    ports:
      - "80:8000"
    environment:
      NGINX_APP_PORT: "8000"
      NGINX_APP_DOMAIN: "freescout.loc"
      NGINX_APP_PHP_FPM: "php-fpm:9000"
    volumes:
      - ./.docker/local/nginx-static/app.conf.template:/etc/nginx/templates/app.conf.template
      - ./public:/app/public
    stop_signal: SIGKILL

  php-fpm:
    build:
      context: .
      args:
        USER_ID: "1000"
        GROUP_ID: "1000"
    environment:
      APP_URL: "http://freescout.loc"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "freescout"
      DB_USERNAME: "freescout_user"
      DB_PASSWORD: "freescout_password"
      APP_KEY: "base64:K4n18z1FVGhtR+52yhye0pynyBbaWB7DXv2old6/+X4="
      APP_ENV: "production"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_CLIENT: "predis"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
    volumes:
      - ./:/app
      - ./.docker/local/php-fpm/custom_php.ini:/usr/local/etc/php/conf.d/custom-php-config.ini
    stop_signal: SIGKILL

  mysql:
    image: percona:8.0.34-26-centos
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_ROOT_HOST: "0.0.0.0"
      MYSQL_DATABASE: "freescout"
      MYSQL_USER: "freescout_user"
      MYSQL_PASSWORD: "freescout_password"

  redis:
      image: redis:7.4.2
      volumes:
          - redis_data:/data
      stop_signal: SIGKILL

volumes:
  mysql_data:
  redis_data:
